<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1970" viewBox="0 0 840 1970" font-family="Segoe UI, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif"><defs><marker id="b" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#1e2a78"/></marker><filter id="a" x="-6%" y="-6%" width="112%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1e2a78" flood-opacity=".07"/></filter></defs><path fill="#fff" d="M0 0h840v1970H0z"/><rect x="24" y="20" width="792" height="296" rx="14" fill="#fbfbfc" stroke="#ececec" stroke-width="1.1"/><text x="40" y="42" font-size="11.5" fill="#8a8f98" font-weight="700" letter-spacing="2">① 客户端层 CLIENTS —— 一套业务语义，全平台交付</text><rect x="40" y="54" width="760" height="76" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="76" font-size="13" fill="#1a1a1a" font-weight="700">Web / PWA（浏览器）</text><text x="58" y="95" font-size="10.5" fill="#3a3f45" font-weight="400">零构建 MPA：76 页、62 页面控制器（原生 ES2022，S.* 命名空间）；三语 i18n 1531 键恒等</text><text x="58" y="113" font-size="10.5" fill="#3a3f45" font-weight="400">PWA：Service Worker 应用壳预缓存 + 离线兜底；自研 SVG 图表五型；GA4 Consent Mode v2 默认 denied</text><rect x="40" y="140" width="760" height="76" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="162" font-size="13" fill="#1a1a1a" font-weight="700">Android（Capacitor 8 + Java 原生插件）/ Windows（Electron 44）/ macOS（Electron 44，Intel &amp; Apple Silicon 兼容）</text><text x="58" y="181" font-size="10.5" fill="#3a3f45" font-weight="400">目录路由，生物识别 ×4 场景（AndroidX Biometric / Windows Hello / Touch ID）；后台通知前台服务，三级自动更新（强制阻断层）</text><text x="58" y="199" font-size="10.5" fill="#3a3f45" font-weight="400">站内链接 100% App 内原生打开，站外内嵌浏览器；返回手势 31 场景接管，Android 客户端无 GMS 实测可用</text><rect x="40" y="226" width="760" height="76" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="248" font-size="13" fill="#1a1a1a" font-weight="700">输入与接入通道</text><text x="58" y="267" font-size="10.5" fill="#3a3f45" font-weight="400">语音双通道：Web Speech API + 阿里云实时 ASR（Worker WS 代理）；文字 / 经典表单 / MCP 编程通道</text><text x="58" y="285" font-size="10.5" fill="#3a3f45" font-weight="400">三通道同一套验证管线 —— 表单、AI 对话、MCP 工具殊途同归</text><path fill="none" stroke="#1e2a78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#b)" d="M420 316v28"/><text x="434" y="334" font-size="10.5" fill="#55595f" font-weight="400">HTTPS，JWT Bearer（表单 / SSE / JSON-RPC）</text><rect x="24" y="344" width="792" height="486" rx="14" fill="#fbfbfc" stroke="#ececec" stroke-width="1.1"/><text x="40" y="366" font-size="11.5" fill="#8a8f98" font-weight="700" letter-spacing="2">② 接入与计算层 —— Cloudflare Worker『suveoo-bank-main』单入口（~9700 行单文件）</text><rect x="40" y="378" width="373" height="98" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="400" font-size="13" fill="#1a1a1a" font-weight="700">静态资产服务</text><text x="58" y="419" font-size="10.5" fill="#3a3f45" font-weight="400">R2 回源：URL 即对象键，/index.html 兜底</text><text x="58" y="437" font-size="10.5" fill="#3a3f45" font-weight="400">缓存头分级、304、安全头，仅 GET/HEAD</text><text x="58" y="458" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#55595f" font-weight="400">suveoo.com/* → www 301 → 裸域</text><rect x="427" y="378" width="373" height="98" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="445" y="400" font-size="13" fill="#1a1a1a" font-weight="700">REST API /api/*</text><text x="445" y="419" font-size="10.5" fill="#3a3f45" font-weight="400">写操作全经 runGuarded()（红级另需 OTP）</text><text x="445" y="437" font-size="10.5" fill="#3a3f45" font-weight="400">读经 requireSession：JWT + 黑名单 + 纪元</text><text x="445" y="458" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#55595f" font-weight="400">两段式：INPUT_REQUIRED → 确认 → EXECUTED</text><rect x="40" y="486" width="373" height="98" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="508" font-size="13" fill="#1a1a1a" font-weight="700">AI 对话 /api/ai/chat</text><text x="58" y="527" font-size="10.5" fill="#3a3f45" font-weight="400">SSE 流式 LLM 代理，Key 仅存 Worker 侧</text><text x="58" y="545" font-size="10.5" fill="#3a3f45" font-weight="400">token / thinking / trust_event 事件流</text><text x="58" y="566" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#55595f" font-weight="400">mcp_servers 自指 /mcp；Trust Console 上墙</text><rect x="427" y="486" width="373" height="98" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="445" y="508" font-size="13" fill="#1a1a1a" font-weight="700">MCP 网关 /mcp</text><text x="445" y="527" font-size="10.5" fill="#3a3f45" font-weight="400">JSON-RPC 2.0, Streamable HTTP, JWT Bearer</text><text x="445" y="545" font-size="10.5" fill="#3a3f45" font-weight="400">63 工具：GREEN 26 / YELLOW 24 / RED 13</text><text x="445" y="566" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#55595f" font-weight="400">initialize / tools/list / tools/call</text><rect x="40" y="594" width="373" height="80" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="616" font-size="13" fill="#1a1a1a" font-weight="700">Cron 引擎（*/5）</text><text x="58" y="636" font-size="10.5" fill="#3a3f45" font-weight="400">NAV / 汇率预热 KV；自动缴费 due_scan</text><text x="58" y="657" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#55595f" font-weight="400">北京时区、防重键、生产实扣</text><rect x="427" y="594" width="373" height="80" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="445" y="616" font-size="13" fill="#1a1a1a" font-weight="700">Email 服务（send_email）</text><text x="445" y="636" font-size="10.5" fill="#3a3f45" font-weight="400">验证码 / 回执 / 告警 20+ 银行级模板</text><text x="445" y="657" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#55595f" font-weight="400">月度 PDF：pdf-lib + 字体子集</text><rect x="40" y="684" width="373" height="80" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="706" font-size="13" fill="#1a1a1a" font-weight="700">运维通知与审计索引</text><text x="58" y="726" font-size="10.5" fill="#3a3f45" font-weight="400">Telegram Bot：注册 / 登录 / EXECUTED</text><text x="58" y="747" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#55595f" font-weight="400">AUDIT_KV 日级索引，waitUntil 保障</text><rect x="427" y="684" width="373" height="80" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="445" y="706" font-size="13" fill="#1a1a1a" font-weight="700">演示与运维端点</text><text x="445" y="726" font-size="10.5" fill="#3a3f45" font-weight="400">/api/demo/seed 演示数据重灌（DEMO_MODE）</text><text x="445" y="747" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#55595f" font-weight="400">ADMIN_TOKEN 双门 fail-closed + 审计</text><rect x="40" y="774" width="760" height="42" rx="10" fill="#1e2a78"/><text x="420" y="800" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">统一验证管线（三通道同规）：compileToIR() → ① POLICY → ② CONSENT → ③ PROVENANCE → ④ INVARIANTS → ⑤ REPLAY → executeIntent()</text><path fill="none" stroke="#1e2a78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#b)" d="M420 830v28"/><text x="434" y="848" font-size="10.5" fill="#55595f" font-weight="400">DO RPC（_namespace 隔离）、KV get/put、R2 读写</text><rect x="24" y="858" width="792" height="290" rx="14" fill="#fbfbfc" stroke="#ececec" stroke-width="1.1"/><text x="40" y="880" font-size="11.5" fill="#8a8f98" font-weight="700" letter-spacing="2">③ 状态与存储层 STATE —— 每用户隔离，SQLite ACID，全参数绑定 SQL</text><rect x="40" y="892" width="760" height="78" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="914" font-size="13" fill="#1a1a1a" font-weight="700">LedgerDO — 每用户账本（SQLite）</text><text x="58" y="933" font-size="10" fill="#55595f" font-weight="400">registry 单例：邮箱 / 卡号全局唯一索引；跨用户转账经对方 DO credit 先行</text><text x="58" y="953" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="10" fill="#1e2a78">profile, cards, tx, payees, bills, subs, holdings, tasks, nonces, audit</text><rect x="40" y="980" width="373" height="72" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="1001" font-size="13" fill="#1a1a1a" font-weight="700">SagaDO — 长程任务</text><text x="58" y="1019" font-size="10.5" fill="#3a3f45" font-weight="400">alarm 精确唤醒 + sweepDue 读路径兜底</text><text x="58" y="1036" font-size="10.5" fill="#3a3f45" font-weight="400">取消 / 补偿触发（T1 锁定 → T2 履约 → C1 解锁）</text><rect x="427" y="980" width="373" height="72" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="445" y="1001" font-size="13" fill="#1a1a1a" font-weight="700">KV — 会话与凭据（SESSION_KV）</text><text x="445" y="1019" font-size="10.5" fill="#3a3f45" font-weight="400">JWT 黑名单、OTP 哈希、登录锁定计数</text><text x="445" y="1036" font-size="10.5" fill="#3a3f45" font-weight="400">Consent Grant（TTL 300s 一次性）、熔断计数</text><rect x="40" y="1062" width="373" height="72" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="58" y="1083" font-size="13" fill="#1a1a1a" font-weight="700">KV — 审计索引（AUDIT_KV）</text><text x="58" y="1101" font-size="10.5" fill="#3a3f45" font-weight="400">audit:{date}:{trace_id} 日级聚合</text><text x="58" y="1118" font-size="10.5" fill="#3a3f45" font-weight="400">全量操作留痕，按日可检索</text><rect x="427" y="1062" width="373" height="72" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><text x="445" y="1083" font-size="13" fill="#1a1a1a" font-weight="700">R2 — 对象存储（suveoo-bank-r2）</text><text x="445" y="1101" font-size="10.5" fill="#3a3f45" font-weight="400">前端静态资产、数据 JSON（基金 / 卡面）</text><text x="445" y="1118" font-size="10.5" fill="#3a3f45" font-weight="400">月度 PDF、APK 分发（/download + sha256）</text><path fill="none" stroke="#1e2a78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#b)" d="M420 1148v28"/><text x="434" y="1166" font-size="10.5" fill="#55595f" font-weight="400">账本内建业务域 —— 六大场景全覆盖</text><rect x="24" y="1176" width="792" height="476" rx="14" fill="#fbfbfc" stroke="#ececec" stroke-width="1.1"/><text x="40" y="1198" font-size="11.5" fill="#8a8f98" font-weight="700" letter-spacing="2">④ 业务能力域 BUSINESS DOMAINS —— LedgerDO / SagaDO 内建（服务端确定性规则）</text><rect x="40" y="1210" width="373" height="136" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><rect x="40" y="1210" width="373" height="3.5" rx="1.75" fill="#1e2a78"/><text x="58" y="1234" font-size="13" fill="#1a1a1a" font-weight="700">智能转账</text><text x="58" y="1255" font-size="10.5" fill="#3a3f45" font-weight="400">按姓名 / 手机号 / 邮箱 / 卡号收款（三重真实性校验）</text><text x="58" y="1273" font-size="10.5" fill="#3a3f45" font-weight="400">跨用户双记：对方 DO credit 先行，trace_id 幂等</text><text x="58" y="1291" font-size="10.5" fill="#3a3f45" font-weight="400">AA 分账守恒（¥860/3 → 286.67/286.67/286.66）</text><text x="58" y="1309" font-size="10.5" fill="#3a3f45" font-weight="400">预约转账：Saga alarm 到点执行，过去时间拒绝</text><text x="58" y="1330" font-family="'Cascadia Code', Consolas, 'Noto Sans Mono', ui-monospace, monospace" font-size="9.5" fill="#55595f" font-weight="400">transfer-flow 10 用例</text><rect x="427" y="1210" width="373" height="136" rx="10" fill="#fff" stroke="#e4e6eb" stroke-width="1.1" filter="url(#a)"/><rect x="427" y="1210" width=