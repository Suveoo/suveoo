<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" fill="none" role="img" aria-label="虚拟信用卡与金币 3D 插画">
  <!-- 主页营销主卡插画 v1：悬浮 3D 信用卡 + 金币堆（白卡压彩色渐变卡底，队长可替换精修版） -->
  <defs>
    <linearGradient id="pcp-card" x1="20" y1="30" x2="110" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E4FF"/>
    </linearGradient>
    <linearGradient id="pcp-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD866"/>
      <stop offset="1" stop-color="#F5B301"/>
    </linearGradient>
    <linearGradient id="pcp-strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="pcp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2A1650" flood-opacity="0.28"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="118" rx="40" ry="8" fill="#1B0B3B" opacity="0.22"/>
  <g filter="url(#pcp-shadow)" transform="rotate(-8 66 62)">
    <rect x="20" y="34" width="88" height="56" rx="9" fill="url(#pcp-card)"/>
    <rect x="20" y="46" width="88" height="12" fill="url(#pcp-strip)" opacity="0.9"/>
    <rect x="28" y="66" width="26" height="8" rx="2.5" fill="#C9BFF5"/>
    <rect x="28" y="78" width="16" height="5" rx="2.5" fill="#DDD7F8"/>
    <circle cx="94" cy="76" r="8" fill="url(#pcp-coin)"/>
    <path d="M94 70.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Zm0 2.2a3.3 3.3 0 1 1 0 6.6 3.3 3.3 0 0 1 0-6.6Z" fill="#B57F00" opacity="0.55"/>
  </g>
  <g transform="rotate(14 100 46)">
    <circle cx="100" cy="44" r="13" fill="url(#pcp-coin)"/>
    <circle cx="100" cy="44" r="8" fill="none" stroke="#B57F00" stroke-width="1.6" opacity="0.6"/>
    <path d="M100 39v10M97.6 41.2h4.8M97.6 46.8h4.8" stroke="#8A5E00" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  </g>
  <circle cx="34" cy="30" r="9" fill="url(#pcp-coin)" opacity="0.92"/>
  <circle cx="34" cy="30" r="5.4" fill="none" stroke="#B57F00" stroke-width="1.2" opacity="0.6"/>
  <path d="M24 62l4-7 4 5 5-9" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" transform="translate(64 -34)"/>
  <circle cx="116" cy="22" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="18" cy="14" r="2" fill="#FFFFFF" opacity="0.55"/>
</svg>
