name = "suveoo-bank-main"
main = "worker-main.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 生产路由（自定义域方式二选一：routes 或 dashboard Custom Domain）
routes = [
  { pattern = "suveoo.com/*", zone_name = "suveoo.com", custom_domain = false },
  { pattern = "www.suveoo.com/*", zone_name = "suveoo.com", custom_domain = false }
]

# Durable Objects（SQLite 存储，免费档可用）
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"
[[durable_objects.bindings]]
name = "SAGA"
class_name = "SagaDO"

# Cron（第九期 NAV 实时化）：每 5 分钟预热底层价格 KV 与汇率，用户请求命中热缓存
[triggers]
crons = ["*/5 * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LedgerDO", "SagaDO"]

# KV
[[kv_namespaces]]
binding = "SESSION_KV"
id = "a4e1bd7856e34feeb9289951ddeb9843"
[[kv_namespaces]]
binding = "AUDIT_KV"
id = "74c46e671810403f9132c30a22e8c298"

# R2
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "suveoo-bank-r2"

# Email Sending（suveoo.com 需先完成 Email Service 域验证，见 §8）
[[send_email]]
name = "EMAIL"

# 普通变量（非密钥）
[vars]
# 第五十七轮：120→300——红级流程用户需点"获取验证码"（60s 冷却）+ 等邮件（~30s）+ 输入，
# 120s 窗口极易超时；5 分钟与银行惯例一致（前端确认卡倒计时读 expires_at 自动跟随）
CONSENT_GRANT_TTL_SECONDS = "300"
INVARIANT_STRICT_MODE = "true"
DEMO_MODE = "true"                  # 演示模式：开启 /api/demo/seed 与故障注入（决赛后改回 "false"）
FIDO2_RP_ID = "suveoo.com"
FIDO2_ORIGIN = "https://suveoo.com"
SENDER_NOREPLY = "noreply@suveoo.com"
SENDER_SECURITY = "security@suveoo.com"
SUPPORT_INBOX = "support@suveoo.com"
# 语音输入底层通道（第四十一轮）："webspeech"=浏览器 Web Speech API（原行为，无 GMS 环境不可用）；
# "ali"=阿里云智能语音交互实时识别（Worker WS 代理，密钥在 secrets ASR_ALI_*，四端通用）。
# 切换只需改这一行 + npx wrangler deploy（教程 for_developer/switch_suveoo_ai_voice_input_path.md）
VOICE_ASR_PROVIDER = "ali"
# LLM Provider（可配置；模型名手动指定，不走 /v1/models 自动发现）
# ── 第十一期起推荐：MODEL_PROFILE 档位切换（worker MODEL_PROFILES 注册表）──
# 设置 MODEL_PROFILE = "glm-5.3-flash" | "glm-5.3-max" | "qwen3.7-flash" 后，
# baseUrl/model/超时/思考提示/key 全由档位决定；key 按 provider 分离：
#   glm 档： secret LLM_API_KEY_GLM（未设则回落既有 LLM_API_KEY）
#   qwen 档：secret LLM_API_KEY_QWEN
# 缺省不设置 MODEL_PROFILE = 沿用下方 LLM_* 三变量（与历史行为逐字节一致）。
# 完整教程（三步切换法/新增模型/回滚/常见坑）：for_developer/switch_models.md
MODEL_PROFILE = "glm-5.3-flash"
# 当前（第五期 idle 2026-09-30 收尾）：切回智谱 glm-5.3-flash（qwen 任务期测试完毕；第十三期红队先例同操作）
LLM_PROVIDER = "glm"
LLM_BASE_URL = "https://open.bigmodel.cn/api/anthropic"
LLM_MODEL = "glm-5.3-flash"
# API Key 一律走 secret（按 provider 分离）：npx wrangler secret put LLM_API_KEY / LLM_API_KEY_GLM / LLM_API_KEY_QWEN
# AI 会话上下文窗口：注入最近 N 轮（2N 条消息；首条用户消息常驻 + 字符预算 ~3000 裁中段）
AI_HISTORY_TURNS = "8"
