name = "suveoo-bank-main"
main = "worker-main.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 生产路由（自定义域方式二选一：routes 或 dashboard Custom Domain）
routes = [
  { pattern = "suveoo.com/*", zone_name = "suveoo.com", custom_domain = false },
  { pattern = "www.suveoo.com/*", zone_name = "suveoo.com", custom_domain = false }
]

# Durable Objects（SQLite 存储，免费档可用）
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"
[[durable_objects.bindings]]
name = "SAGA"
class_name = "SagaDO"

# Cron（第九期 NAV 实时化）：每 5 分钟预热底层价格 KV 与汇率，用户请求命中热缓存
[triggers]
crons = ["*/5 * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LedgerDO", "SagaDO"]

# KV
[[kv_namespaces]]
binding = "SESSION_KV"
id = "a4e1bd7856e34feeb9289951ddeb9843"
[[kv_namespaces]]
binding = "AUDIT_KV"
id = "74c46e671810403f9132c30a22e8c298"

# R2
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "suveoo-bank-r2"

# Email Sending（suveoo.com 需先完成 Email Service 域验证，见 §8）
[[send_email]]
name = "EMAIL"

# 普通变量（非密钥）
[vars]
CONSENT_GRANT_TTL_SECONDS = "120"
INVARIANT_STRICT_MODE = "true"
DEMO_MODE = "true"                  # 演示模式：开启 /api/demo/seed 与故障注入（决赛后改回 "false"）
FIDO2_RP_ID = "suveoo.com"
FIDO2_ORIGIN = "https://suveoo.com"
SENDER_NOREPLY = "noreply@suveoo.com"
SENDER_SECURITY = "security@suveoo.com"
SUPPORT_INBOX = "support@suveoo.com"
# LLM Provider（可配置；模型名手动指定，不走 /v1/models 自动发现）
# 当前（第二十八轮）：智谱开放平台 Anthropic 兼容端点 + glm-5.3-flash（思考型；tools/tool_use/流式实测全兼容）
LLM_PROVIDER = "glm"
LLM_BASE_URL = "https://open.bigmodel.cn/api/anthropic"
LLM_MODEL = "glm-5.3-flash"
# AI 会话上下文窗口：注入最近 N 轮（2N 条消息；首条用户消息常驻 + 字符预算 ~3000 裁中段）
AI_HISTORY_TURNS = "8"
# 切换示例：
#   智谱 OpenAI 兼容端点（协议不同，需改 llmMessages，勿仅改此处）：https://open.bigmodel.cn/api/paas/v4
#   Anthropic 直连：LLM_PROVIDER="anthropic" LLM_BASE_URL="https://api.anthropic.com" LLM_MODEL="claude-haiku-4.5"
#   阿里百炼（上一代）：LLM_PROVIDER="qwen" LLM_BASE_URL="https://ws-i7yvdr80f0iv6wg4.cn-beijing.maas.aliyuncs.com/apps/anthropic" LLM_MODEL="qwen3.6-flash"
# API Key 一律走 secret：npx wrangler secret put LLM_API_KEY
