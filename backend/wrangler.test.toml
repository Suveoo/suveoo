# 仅用于 vitest-pool-workers（@cloudflare/vitest-pool-workers）本地测试环境。
# 与 wrangler.toml 的差异：不含 routes / send_email（miniflare 不支持），
# 增加 MAIL_OUTBOX（测试收件箱 KV）；密钥用明文测试值。
name = "suveoo-bank-main-test"
main = "worker-main.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SESSION_KV"
id = "test_session_kv"
[[kv_namespaces]]
binding = "AUDIT_KV"
id = "test_audit_kv"
[[kv_namespaces]]
binding = "MAIL_OUTBOX"
id = "test_mail_outbox"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "suveoo-bank-r2-test"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"
[[durable_objects.bindings]]
name = "SAGA"
class_name = "SagaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LedgerDO", "SagaDO"]

[vars]
JWT_SECRET = "test-jwt-secret-not-for-prod"
CANARY_TOKEN_SECRET = "test-canary-secret"
CONSENT_GRANT_TTL_SECONDS = "120"
CIRCUIT_LOCK_SECONDS = "3"
INVARIANT_STRICT_MODE = "true"
DEMO_MODE = "true"
ADMIN_TOKEN = "test-admin-token-2026"
FIDO2_RP_ID = "suveoo.com"
FIDO2_ORIGIN = "https://suveoo.com"
SENDER_NOREPLY = "noreply@suveoo.com"
SENDER_SECURITY = "security@suveoo.com"
SUPPORT_INBOX = "support@suveoo.com"
LLM_PROVIDER = "anthropic"
# 第九期 NAV 实时化：测试池禁真实外呼（价格/汇率源），NAV 逐基金回退静态——同实时化之前行为
NO_PRICE_FETCH = "1"
# 第二十六轮：会话历史测试——假 LLM 端点（127.0.0.1:1 即刻拒连）驱动失败轮路径（user 侧落库）；
# 上下文窗口轮数与生产一致
AI_HISTORY_TURNS = "8"
LLM_BASE_URL = "http://127.0.0.1:1"
LLM_API_KEY = "sk-test-integration"
